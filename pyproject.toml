[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-detection"
version = "0.1.0"
description = "Multi-agent system for fake news detection, credibility scoring and propagation analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fake-news-detect = "fake_news_detection.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fake_news_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
